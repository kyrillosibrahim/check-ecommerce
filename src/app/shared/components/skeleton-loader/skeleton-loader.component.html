@if (type === 'card') {
  <div class="row g-4 row-cols-lg-5">
    @for (item of items; track $index) {
      <div class="col-6 col-md-4 col-lg">
        <div class="card border-0 shadow-sm" style="background-color: var(--sz-bg-card);">
          <div class="skeleton" style="height: 220px;"></div>
          <div class="card-body">
            <div class="skeleton mb-2" style="height: 12px; width: 40%;"></div>
            <div class="skeleton mb-2" style="height: 16px; width: 80%;"></div>
            <div class="skeleton mb-2" style="height: 14px; width: 60%;"></div>
            <div class="skeleton mt-3" style="height: 20px; width: 50%;"></div>
          </div>
          <div class="card-footer bg-transparent border-0 pb-3">
            <div class="skeleton" style="height: 36px;"></div>
          </div>
        </div>
      </div>
    }
  </div>
}

@if (type === 'detail') {
  <div class="row g-4">
    <div class="col-md-6">
      <div class="skeleton" style="height: 400px;"></div>
      <div class="d-flex gap-2 mt-3">
        <div class="skeleton" style="height: 80px; width: 80px;"></div>
        <div class="skeleton" style="height: 80px; width: 80px;"></div>
        <div class="skeleton" style="height: 80px; width: 80px;"></div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="skeleton mb-3" style="height: 14px; width: 30%;"></div>
      <div class="skeleton mb-3" style="height: 28px; width: 80%;"></div>
      <div class="skeleton mb-3" style="height: 16px; width: 40%;"></div>
      <div class="skeleton mb-3" style="height: 24px; width: 35%;"></div>
      <div class="skeleton mb-2" style="height: 14px; width: 100%;"></div>
      <div class="skeleton mb-2" style="height: 14px; width: 90%;"></div>
      <div class="skeleton mb-4" style="height: 14px; width: 70%;"></div>
      <div class="skeleton" style="height: 44px; width: 50%;"></div>
    </div>
  </div>
}

@if (type === 'list') {
  @for (item of items; track $index) {
    <div class="d-flex gap-3 mb-3 p-3 rounded" style="background-color: var(--sz-bg-card);">
      <div class="skeleton" style="width: 80px; height: 80px; flex-shrink: 0;"></div>
      <div class="flex-grow-1">
        <div class="skeleton mb-2" style="height: 16px; width: 60%;"></div>
        <div class="skeleton mb-2" style="height: 14px; width: 40%;"></div>
        <div class="skeleton" style="height: 14px; width: 30%;"></div>
      </div>
    </div>
  }
}
