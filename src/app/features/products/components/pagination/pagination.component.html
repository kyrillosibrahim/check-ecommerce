<nav class="d-flex justify-content-center mt-5">
  <ul class="pagination">
    <li class="page-item" [class.disabled]="currentPage === 1">
      <a class="page-link cursor-pointer" (click)="goToPage(currentPage - 1)">
        <i class="bi" [class.bi-chevron-left]="!translationService.isArabic()" [class.bi-chevron-right]="translationService.isArabic()"></i>
      </a>
    </li>

    @for (page of pages; track page) {
      <li class="page-item" [class.active]="page === currentPage">
        <a class="page-link cursor-pointer" (click)="goToPage(page)">{{ page }}</a>
      </li>
    }

    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <a class="page-link cursor-pointer" (click)="goToPage(currentPage + 1)">
        <i class="bi" [class.bi-chevron-right]="!translationService.isArabic()" [class.bi-chevron-left]="translationService.isArabic()"></i>
      </a>
    </li>
  </ul>
</nav>
