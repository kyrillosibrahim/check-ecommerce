<div class="gallery">
  <!-- Main Image -->
  <div
    class="main-image-wrapper"
    #mainWrapper
    [class.zoomed]="isZoomed()"
    (wheel)="onWheel($event)"
    (mousedown)="onMouseDown($event)"
    (dblclick)="onDoubleClick()"
  >
    <img
      [src]="selectedImage"
      [alt]="productTitle"
      class="main-image"
      [style.transform]="'scale(' + zoomScale() + ') translate(' + translateX() + 'px, ' + translateY() + 'px)'"
      [style.cursor]="isZoomed() ? 'grab' : 'zoom-in'"
      draggable="false"
    />
    @if (zoomScale() > 1) {
      <div class="zoom-reset-hint">دبل كليك للرجوع</div>
    }
  </div>

  <!-- Thumbnails -->
  @if (images.length > 1) {
    <div class="thumbnails">
      @for (img of images; track $index) {
        <button class="thumb-btn" [class.active]="$index === selectedIndex()" (click)="selectImage($index)">
          <img [src]="img" [alt]="productTitle + ' - ' + ($index + 1)" class="thumb-img" />
        </button>
      }
    </div>
  }
</div>
