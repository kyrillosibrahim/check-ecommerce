<section class="dom-sheet">

  <header class="dom-header">
    <div>
      <h3>الطلب المباشر</h3>
      <p>اطلب المنتج مباشرة بدون إنشاء حساب</p>
    </div>
  </header>

  <div class="dom-body">

    <form [formGroup]="form" (ngSubmit)="placeOrder()" class="dom-form">

      <div class="dom-row">
        <div class="dom-field">
          <label>الاسم</label>
          <div class="dom-input-wrap">
            <i class="bi bi-person dom-input-icon"></i>
            <input type="text" class="dom-input" formControlName="name" placeholder="الاسم بالكامل">
          </div>
        </div>

        <div class="dom-field">
          <label>رقم الهاتف (واتساب)</label>
          <div class="dom-input-wrap">
            <i class="bi bi-whatsapp dom-input-icon"></i>
            <input type="tel" class="dom-input" formControlName="phone" placeholder="01XXXXXXXXX" dir="ltr">
          </div>
        </div>
      </div>

      <div class="dom-row">
        <div class="dom-field">
          <label>رقم هاتف بديل <span class="dom-optional">(اختياري)</span></label>
          <div class="dom-input-wrap">
            <i class="bi bi-telephone dom-input-icon"></i>
            <input type="tel" class="dom-input" formControlName="altPhone" placeholder="01XXXXXXXXX" dir="ltr">
          </div>
        </div>

        <div class="dom-field">
          <label>المحافظة</label>
          <div class="dom-input-wrap">
            <i class="bi bi-geo-alt dom-input-icon"></i>
            <select class="dom-input dom-select" formControlName="governorate" (change)="onGovernorateChange()">
              <option value="" disabled>اختر المحافظة</option>
              @for (gov of governorates; track gov.id) {
                <option [value]="gov.governorate_name_en">{{ gov.governorate_name_ar }}</option>
              }
            </select>
            <i class="bi bi-chevron-down dom-select-arrow"></i>
          </div>
        </div>
      </div>

      <div class="dom-field">
        <label>المدينة</label>
        <div class="dom-input-wrap">
          <i class="bi bi-buildings dom-input-icon"></i>
          <select class="dom-input dom-select" formControlName="city" [disabled]="cities.length === 0">
            <option value="" disabled>اختر المدينة</option>
            @for (city of cities; track city.id) {
              <option [value]="city.city_name_en">{{ city.city_name_ar }}</option>
            }
          </select>
          <i class="bi bi-chevron-down dom-select-arrow"></i>
        </div>
      </div>

      <div class="dom-field">
        <div class="dom-label-row">
          <label>العنوان بالتفصيل</label>
          <button type="button" class="dom-gps-btn" (click)="useCurrentLocation()" [disabled]="locating()">
            @if (locating()) {
              <span class="spinner-border spinner-border-sm"></span>
            } @else {
              <i class="bi bi-geo-alt"></i>
            }
            موقعك الحالي
          </button>
        </div>
        <textarea class="dom-input dom-textarea" formControlName="address" rows="3" placeholder="الشارع، رقم المبنى، الدور..."></textarea>
      </div>

      <!-- Payment method -->
      <div class="dom-field">
        <label>طريقة الدفع</label>
        <div class="dom-payment-grid">
          <button type="button" class="dom-pay-card" [class.active]="paymentMethod() === 'cod'" (click)="selectPayment('cod')">
            <div class="dom-radio"><span></span></div>
            <div class="dom-pay-body">
              <span class="dom-pay-title">الدفع عند الاستلام</span>
              <span class="dom-pay-sub">ادفع نقدًا عند استلام الطلب</span>
            </div>
            <i class="bi bi-cash-coin dom-pay-icon"></i>
          </button>

          <button type="button" class="dom-pay-card" [class.active]="paymentMethod() === 'instapay'" (click)="selectPayment('instapay')">
            <div class="dom-radio"><span></span></div>
            <div class="dom-pay-body">
              <span class="dom-pay-title">
                INSTAPAY
                <span class="dom-pay-badge">خصم 50% على الشحن</span>
              </span>
              <span class="dom-pay-sub">الطلب عن طريق إنستاباي يضمن خصم 50% من قيمة الشحن</span>
            </div>
            <i class="bi bi-credit-card dom-pay-icon"></i>
          </button>
        </div>
      </div>

      <!-- Totals -->
      @if (selectedGov) {
        <div class="dom-totals">
          <div class="dom-total-row"><span>المجموع</span><span>{{ subtotal | number:'1.0-0' }} ج.م</span></div>
          <div class="dom-total-row"><span>الشحن</span><span>{{ shippingCost | number:'1.0-0' }} ج.م</span></div>
          <div class="dom-total-row dom-grand"><span>الإجمالي</span><span>{{ total | number:'1.0-0' }} ج.م</span></div>
        </div>
      }

      <button type="submit" class="dom-buy-btn" [disabled]="form.invalid || submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
          جاري إرسال الطلب...
        } @else {
          <i class="bi bi-bag-check me-2"></i>اشترِ الآن
        }
      </button>
    </form>
  </div>
</section>
