@if (items.length > 0) {
  <div class="swiper" #swiperRef>
    <div class="swiper-wrapper">
      @for (item of items; track $index) {
        <div class="swiper-slide">
          @if (item.link) {
            <a [href]="item.link"  rel="noopener" class="np-card">
              @if (isVideo(item.video)) {
                <video [src]="item.video" [poster]="posterFor(item.video)" muted loop playsinline preload="none"></video>
              } @else {
                <img [src]="item.video | cldImage:400" alt="" loading="lazy" draggable="false">
              }
              @if (productFor(item); as p) {
                <app-video-product-card class="np-product" [product]="p" [compact]="true" />
              }
            </a>
          } @else {
            <div class="np-card">
              @if (isVideo(item.video)) {
                <video [src]="item.video" [poster]="posterFor(item.video)" muted loop playsinline preload="none"></video>
              } @else {
                <img [src]="item.video | cldImage:400" alt="" loading="lazy" draggable="false">
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
}
