@if (items.length > 0) {
  <div class="swiper" #swiperRef>
    <div class="swiper-wrapper">
      @for (item of items; track $index) {
        <div class="swiper-slide">
          @if (item.link) {
            <a [href]="item.link"  rel="noopener" class="np-card">
              @if (isVideo(item.video)) {
                <video [src]="item.video" autoplay muted loop playsinline preload="metadata"></video>
              } @else {
                <img [src]="item.video" alt="" loading="lazy" draggable="false">
              }
            </a>
          } @else {
            <div class="np-card">
              @if (isVideo(item.video)) {
                <video [src]="item.video" autoplay muted loop playsinline preload="metadata"></video>
              } @else {
                <img [src]="item.video" alt="" loading="lazy" draggable="false">
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
}
