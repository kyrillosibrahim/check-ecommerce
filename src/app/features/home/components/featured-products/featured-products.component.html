<div class="slider-wrapper">
  <button class="nav-btn prev-btn" (click)="slidePrev()">
    <i class="bi bi-chevron-right"></i>
  </button>

  <div class="swiper" #swiperRef>
    <div class="swiper-wrapper">
      @for (product of products; track product.id) {
        <div class="swiper-slide">
          <app-product-card
            [product]="product"
            (addToCart)="addToCart.emit($event)"
            (addToWishlist)="addToWishlist.emit($event)" />
        </div>
      }
    </div>
  </div>

  <button class="nav-btn next-btn" (click)="slideNext()">
    <i class="bi bi-chevron-left"></i>
  </button>
</div>

<div class="text-center mt-4">
  <a routerLink="/products" class="btn btn-outline-primary">
    {{ 'home.view_all_products' | translate }} <i class="bi bi-arrow-right ms-1"></i>
  </a>
</div>
