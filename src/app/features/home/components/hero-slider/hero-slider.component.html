<div class="container mt-3" style="padding: 1% 3%;">
  @if (loading() && banners().length === 0) {
    <!-- Skeleton Loading -->
    <div class="skeleton-slider rounded-1 overflow-hidden">
      <div class="skeleton-shimmer"></div>
    </div>
  } @else if (banners().length > 0) {
    <div id="heroCarousel" class="carousel slide rounded-1 overflow-hidden" data-bs-ride="carousel" data-bs-interval="3500">
      <!-- Indicators -->
      <div class="carousel-indicators">
        @for (banner of banners(); track banner.id; let i = $index) {
          <button type="button" data-bs-target="#heroCarousel" [attr.data-bs-slide-to]="i"
                  [class.active]="i === 0"></button>
        }
      </div>

      <!-- Slides -->
      <div class="carousel-inner hei">
        @for (banner of banners(); track banner.id; let i = $index) {
          <div class="carousel-item" style="height: 100%;" [class.active]="i === 0">
            @if (banner.link) {
              <a style="cursor: pointer;" (click)="navigateTo(banner.link)">
                <img [src]="banner.image" class="d-block w-100 hero-image" alt="بنر">
              </a>
            } @else {
              <img [src]="banner.image" class="d-block w-100 hero-image" alt="بنر">
            }
          </div>
        }
      </div>

      <!-- Controls -->
      <button class="carousel-control-prev importbuttomstyle" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next importbuttomstyle" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  }
</div>
