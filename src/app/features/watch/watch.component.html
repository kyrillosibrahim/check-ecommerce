<div class="watch-feed" #feed>
  @for (item of items; track $index) {
    <div class="watch-slide" (click)="openLink(item)">
      <video
        #slideVideo
        [src]="item.video"
        [attr.poster]="item.poster"
        muted
        loop
        playsinline
        preload="metadata"
      ></video>
      @if (item.link) {
        <div class="watch-hint">
          <i class="bi bi-box-arrow-up-right"></i>
          <span>اضغط على الفيديو للوصول للمنتج</span>
        </div>
      }
    </div>
  }

  @if (items.length === 0) {
    <div class="watch-empty">
      <i class="bi bi-camera-video-off"></i>
      <p>لا توجد فيديوهات حالياً</p>
    </div>
  }

  @if (items.length > 0) {
    <button type="button" class="watch-sound" (click)="toggleSound($event)"
            [attr.aria-label]="muted() ? 'تشغيل الصوت' : 'كتم الصوت'">
      <i class="bi" [class.bi-volume-mute-fill]="muted()" [class.bi-volume-up-fill]="!muted()"></i>
    </button>
  }

  <div class="watch-controls">
    <button type="button" class="watch-arrow watch-arrow--up" (click)="scrollBySlide(-1)" aria-label="Previous">
      <img src="assets/iconsd/arrow-down.png" alt="" />
    </button>
    <button type="button" class="watch-arrow" (click)="scrollBySlide(1)" aria-label="Next">
      <img src="assets/iconsd/arrow-down.png" alt="" />
    </button>
  </div>
</div>
