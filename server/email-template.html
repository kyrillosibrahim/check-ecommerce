<div style="font-family: 'Segoe UI', Tahoma, Arial, sans-serif; direction: rtl; max-width: 500px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #e8e8e8;">

  <!-- Header -->
  <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px 20px; text-align: center;">
    <div style="font-size: 40px; margin-bottom: 8px;">🔑</div>
    <h1 style="color: #ffffff; font-size: 20px; margin: 0; font-weight: 700;">رمز التحقق من Check</h1>
  </div>

  <!-- Body -->
  <div style="padding: 30px 25px; text-align: center;">
    <p style="color: #555; font-size: 15px; margin: 0 0 5px;">مرحباً <strong style="color: #333;">{{to_name}}</strong>،</p>
    <p style="color: #555; font-size: 14px; margin: 0 0 25px;">لقد طلبت إعادة تعيين كلمة المرور. يرجى استخدام رمز التحقق التالي:</p>

    <!-- OTP Box -->
    <div style="background-color: #f0f4ff; border: 2px dashed #667eea; border-radius: 12px; padding: 20px; margin: 0 auto 20px; max-width: 280px;">
      <div style="font-size: 36px; font-weight: 800; letter-spacing: 12px; color: #667eea; font-family: 'Courier New', monospace; direction: ltr;">{{otp_code}}</div>
    </div>

    <p style="color: #e74c3c; font-size: 13px; margin: 0 0 25px;">
      ⏰ هذا الرمز صالح لمدة <strong>5 دقائق</strong> فقط
    </p>

    <div style="background-color: #fff8e1; border-radius: 8px; padding: 12px 16px; margin: 0 0 20px;">
      <p style="color: #f39c12; font-size: 12px; margin: 0;">
        ⚠️ إذا لم تطلب إعادة تعيين كلمة المرور، يرجى تجاهل هذه الرسالة.
      </p>
    </div>
  </div>

  <!-- Footer -->
  <div style="background-color: #f8f9fa; padding: 20px; text-align: center; border-top: 1px solid #e8e8e8;">
    <p style="color: #333; font-size: 14px; font-weight: 700; margin: 0 0 5px;">🛒 Check Store</p>
    <p style="color: #999; font-size: 11px; margin: 0;">شكراً لاستخدامك منصة Check</p>
  </div>

</div>
