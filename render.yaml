services:
  # ── Express Backend API ──────────────────────────────────────────────
  - type: web
    name: check-ecommerce
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false        # Add in Render dashboard
      - key: JWT_SECRET
        sync: false        # Add in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false        # Add in Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false        # Add in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false        # Add in Render dashboard

  # ── Angular SSR Frontend ─────────────────────────────────────────────
  - type: web
    name: check-store
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/e-commerce/server/server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
